apiVersion: v1
kind: Service
metadata:
  name: production-krakend-svc
  namespace: production
spec:
  type: NodePort
  ports:
  - name: 'http'
    port: 8400
    targetPort: 8400
    protocol: TCP
  - name: 'admin'
    port: 8081
    targetPort: 8081
    protocol: TCP
  selector:
    dep: production-krakend
