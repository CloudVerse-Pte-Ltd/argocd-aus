
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bill-ops
  namespace: production
  labels:
    dep: bill-ops
spec:
  replicas: 2
  selector:
    matchLabels:
      dep: bill-ops
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 100%
      maxUnavailable: 0%
  template:
    metadata:
      name: bill-ops
      labels:
        dep: bill-ops
    spec:
      containers:
      - name: app
        image: asia-southeast1-docker.pkg.dev//prod/platform-bill-ops:release.v250826.8
        imagePullPolicy: IfNotPresent
        resources:
          limits:
            cpu: "1"
            memory: "2Gi"
          requests:
            cpu: "25m"
            memory: "50Mi"
        envFrom:
        - secretRef:
            name: production-common-secret
        - secretRef:
            name: production-bill-ops
        volumeMounts:
        - name: gcp-creds
          mountPath: /app/gcp_credentials.json
          subPath: gcp_credentials.json
      volumes:
      - name: gcp-creds
        secret:
          secretName: production-cloud-provider-driver-gcp-credentials-secret
