
apiVersion: v1
kind: Service
metadata:
  name: production-aio-frontend-svc
  namespace: production
  labels:
    service: production-aio-frontend
spec:
  selector:
    dep: production-aio-frontend
  type: NodePort
  ports:
  - port: 3000
    targetPort: 3000
    name: frontend
  - port: 3010
    targetPort: 3010
    name: identity
  - port: 3020
    targetPort: 3020
    name: billops
